<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CDMSEA: Streamer Feedback for CABAL Revolution</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Michroma&display=swap">
<style>
:root{--bg:#000;--panel:#0A0C0B;--panel2:#101412;--line:#1D2421;--line2:#2A332F;--ink:#E9F2EE;--mute:#8C9993;--dim:#5C6762;
--accent:#16FFA8;--accent-soft:rgba(22,255,168,.08);--post:#69D8E4;--short:#8CB5FF;--warn:#FFD866;
--grad:linear-gradient(90deg,#16FFA8 0%,#26FF87 40%,#69D8E4 75%,#8CB5FF 100%);
--display:"Michroma","Kanit",system-ui,sans-serif;--body:"Kanit",system-ui,"Noto Sans Thai",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:14.5px;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:22px 18px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.logo{height:30px;width:auto;display:block;margin-bottom:14px}
.mark{font-family:var(--display);font-size:clamp(15px,2.3vw,21px);line-height:1.4;letter-spacing:.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.badge{font-size:12px;color:var(--warn);border:1px solid currentColor;border-radius:20px;padding:1px 10px}
.banner{position:relative;overflow:hidden;min-height:330px;align-items:flex-end;justify-content:flex-start;padding:26px 28px;border:1px solid var(--line2);border-radius:16px;background:radial-gradient(ellipse 55% 85% at 76% 78%,rgba(255,104,26,.32),transparent 72%),radial-gradient(ellipse 35% 55% at 96% 8%,rgba(22,255,168,.10),transparent 70%),#050706}
.banner .bn-text{position:relative;z-index:3;max-width:min(430px,46%)}
.banner .logo{margin-bottom:18px}
.banner .mark{font-size:clamp(10px,1.35vw,14px);margin-bottom:8px}
.banner .revo{display:block;height:clamp(64px,9.5vw,112px);width:auto;max-width:100%;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.banner .sub{margin-top:14px}
.chars{position:absolute;top:0;bottom:0;right:0;width:62%;pointer-events:none;z-index:1}
.chars img{position:absolute;bottom:0;width:auto;max-width:none;filter:drop-shadow(0 10px 28px rgba(255,90,20,.38))}
.ch-a{height:84%;left:2%;z-index:1}
.ch-g{height:90%;left:56%;z-index:1}
.ch-w{height:95%;left:27%;z-index:2}
@media(max-width:760px){.banner{display:block;padding:20px 18px 0;min-height:0}.banner .bn-text{max-width:100%}.chars{position:relative;width:100%;height:240px;margin-top:6px}.ch-a{height:80%;left:0}.ch-w{height:96%;left:22%}.ch-g{height:78%;left:52%}}
.lang{margin-left:auto;display:inline-flex;border:1px solid var(--line2);border-radius:20px;padding:2px;background:var(--panel)}
.lang button{font:inherit;font-size:12.5px;letter-spacing:.08em;color:var(--mute);background:none;border:0;border-radius:18px;padding:3px 18px;cursor:pointer}
.lang button.on{background:var(--accent);color:#000;font-weight:500}
.en-body{columns:2 340px;column-gap:36px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.kpi{background:var(--panel);padding:14px 16px}
.kpi small{color:var(--mute);font-size:12px;display:block}
.kpi b{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi b.g{color:var(--accent)}
.hero{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:26px 28px;margin-bottom:18px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--grad)}
.hero .q{font-size:clamp(18px,2.6vw,26px);font-weight:400;line-height:1.5;margin:0 0 18px;max-width:880px}
.hero .big{font-family:var(--display);font-size:46px;line-height:.5;color:var(--accent);display:block;margin-bottom:10px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;color:var(--mute);background:none;border:1px solid var(--line2);border-radius:20px;padding:3px 13px;cursor:pointer}
.chip.on{color:#000;background:var(--accent);border-color:var(--accent);font-weight:500}
.wall{columns:3 300px;column-gap:14px}
.card{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 14px;display:grid;gap:14px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.stars{color:var(--accent);letter-spacing:2px;font-size:14px}
.stars s{text-decoration:none;color:var(--line2)}
.txt{white-space:pre-line;margin:0;font-size:16.5px;font-weight:400;line-height:1.65;color:var(--ink)}
.orig{white-space:pre-line;margin:10px 0 0;font-size:11.5px;font-weight:300;line-height:1.5;color:#7d8883}
mark{background:none;color:var(--accent);font-weight:600}
.wide{column-span:all}
.wide .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
.h{margin:0 0 8px;font-family:var(--display);font-size:11px;font-weight:400;letter-spacing:.1em;color:var(--mute)}
.lst{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.lst li{position:relative;padding-left:22px;font-size:15px;font-weight:400;line-height:1.6}
.lst li::before{position:absolute;left:0;top:0;font-weight:500}
.lst.pro li::before{content:"+";color:var(--accent)}
.lst.con li::before{content:"\2212";color:var(--warn)}
.lst.dot li::before{content:"\2022";color:var(--mute)}
@media(max-width:760px){.wide .cols{grid-template-columns:1fr}}
.shot{width:100%;border-radius:8px;border:1px solid var(--line2);display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(22,255,168,.2);border-radius:6px;padding:0 8px}
.who{display:flex;gap:11px;align-items:center;border-top:1px solid var(--line);padding-top:13px}
.av{width:44px;height:44px;border-radius:50%;flex:none;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-size:12px;color:var(--accent);overflow:hidden}
a.av{text-decoration:none;transition:border-color .15s}a.av:hover{border-color:var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:500;line-height:1.25}
.mt{color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:400;color:var(--post)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fol{margin-left:auto;text-align:right;flex:none;font-size:12px;color:var(--mute)}
.fol b{display:block;color:var(--ink);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.empty{color:var(--dim);padding:40px;text-align:center;border:1px dashed var(--line2);border-radius:12px}
</style>
</head>

  quote:"ส่วนตัวแล้วมองว่า CABAL Revolution เข้ามาเติมความสดใหม่ให้ชุมชน CABAL โดยเฉพาะระบบซีซันที่นำสิ่งใหม่และแตกต่างจากเวอร์ชันก่อนๆ มาให้\n\nเข้าใจว่าระบบใหม่นี้อาจยังไม่ถูกยอมรับจากผู้เล่นทุกคนในตอนนี้ แต่ก็หวังว่าเมื่อเวลาผ่านไป ผู้เล่นจะค่อยๆ ปรับตัวและสนุกไปกับแนวคิดใหม่นี้\n\nส่วนตัวแล้วชอบระบบที่ CABAL Revolution นำมาใช้ อย่างไรก็ตาม ต่อจากนี้หวังว่าทีมพัฒนาจะรับฟังความเห็น ฟีดแบ็ก และคำวิจารณ์ของผู้เล่นให้มากขึ้น เพราะชุมชนมีบทบาทสำคัญต่อการเติบโตของเกมทุกเกม",
  pros:["ALZ เป็นสกุลเงินหลักในเกม ช่วยให้การฟาร์มคุ้มค่ามากขึ้น และทำให้เศรษฐกิจในเกมน่าสนใจขึ้น", "ระบบ Trade Target ให้เป้าหมายเพิ่มเติมแก่ผู้เล่น และกระตุ้นกิจกรรมด้านเศรษฐกิจและการซื้อขายให้มากขึ้น", "การปรับปรุงอาชีพ (Job Revamp) เป็นการพัฒนาที่น่าสนใจ เช่น Force Gunner ที่เคยถูกมองว่าแข็งแกร่งเกินไปในเวอร์ชันก่อนๆ การปรับครั้งนี้เปิดโอกาสให้บาลานซ์อาชีพดีขึ้น"],
  cons:["ยังมีบั๊กค่อนข้างมากที่ต้องแก้ไข", "เกมเด้ง (Force Close) หรือค้างบ่อยเมื่อเล่นบนสมาร์ตโฟน", "จากประสบการณ์ส่วนตัว เกมรู้สึกหนักและไม่ลื่นเท่า CABAL Infinite Combo หวังว่าการเพิ่มประสิทธิภาพจะเป็นหนึ่งในสิ่งที่ทีมพัฒนาให้ความสำคัญ"],
  closing:"โดยรวมแล้วเชื่อว่า CABAL Revolution มีศักยภาพสูงจากแนวคิดและระบบใหม่ๆ แม้จะยังมีหลายจุดที่ต้องปรับปรุง โดยเฉพาะปัญหาด้านเทคนิคและประสิทธิภาพ แต่ก็หวังว่าทีมพัฒนาจะประเมินเกมต่อเนื่องและเปิดรับฟีดแบ็กจากชุมชน เพื่อให้ CABAL Revolution เป็นประสบการณ์ที่ดีขึ้นสำหรับทุกคน",
  orig:"In my opinion, CABAL Revolution is a breath of fresh air for the CABAL community, especially because the Season System introduces something new and different from previous CABAL versions.\n\nI understand that this new system may not be accepted by all players yet. However, I hope that over time, players will gradually adapt to and enjoy this new concept.\n\nPersonally, I enjoy the systems introduced in CABAL Revolution. However, moving forward, I hope the development team will listen more closely to players' opinions, feedback, and criticism, because the community plays an important role in the growth of any game.\n\nStrengths of CABAL Revolution CBT based on my experience:\n1. ALZ as the main in-game currency. I believe this gives more value to farming activities and makes the in-game economy more interesting.\n2. The trade target system gives players additional goals and encourages more economic and trading activities.\n3. Job revamps are an interesting improvement. For example, Force Gunner was previously considered too overpowered in earlier CABAL versions. These changes create an opportunity for better job balance.\nWeaknesses and areas that need improvement:\n1. There are still quite a lot of bugs that need to be fixed.\n2. The game frequently experiences force closes or freezes when playing on smartphones.\n3. Based on my personal experience, the game feels heavier and less smooth compared to CABAL Infinite Combo. I hope performance optimization will become one of the development team's priorities.\nFinal Thoughts:\n\nOverall, I believe CABAL Revolution has great potential with its new concepts and systems. There are still several areas that need improvement, especially regarding technical issues and performance. However, I hope the development team continues to evaluate the game and remain open to community feedback so that CABAL Revolution can become a better experience for everyone.",tags:[],
  hl:["เติมความสดใหม่ให้ชุมชน CABAL", "ระบบซีซันที่นำสิ่งใหม่และแตกต่าง", "รับฟังความเห็น ฟีดแบ็ก และคำวิจารณ์ของผู้เล่นให้มากขึ้น", "ช่วยให้การฟาร์มคุ้มค่ามากขึ้น", "ให้เป้าหมายเพิ่มเติมแก่ผู้เล่น", "เปิดโอกาสให้บาลานซ์อาชีพดีขึ้น", "ยังมีบั๊กค่อนข้างมาก", "เกมเด้ง (Force Close) หรือค้างบ่อย", "หนักและไม่ลื่นเท่า CABAL Infinite Combo", "มีศักยภาพสูง"],

  quote:"",
  mid:"ระบบความยากและการฟาร์มในปัจจุบันช่วยรักษาอายุของเกมให้ยืนยาว แต่การปรับสมดุลระหว่างการพัฒนาตัวละครกับรางวัลจะช่วยให้ประสบการณ์โดยรวมดีขึ้น",
  pros:["Cabal Revolution มีเกมเพลย์ที่ท้าทาย ระบบการพัฒนาตัวละครที่ให้ผลตอบแทนคุ้มค่า และดันเจี้ยนที่น่าสนุก กระตุ้นให้ผู้เล่นพัฒนาบิลด์และกลยุทธ์ของตัวเอง"],
  cons:["อัตรา Alz และ EXP รู้สึกต่ำเกินไปเมื่อเทียบกับเวลาและแรงที่ต้องลงไปเพื่อพัฒนาตัวละคร", "มอนสเตอร์และดันเจี้ยนบางจุดยากเกินไป โดยเฉพาะเมื่อรางวัลที่ได้ไม่คุ้มกับความยาก"],
  closing:"โดยรวมแล้ว Cabal Revolution มีศักยภาพสูง แต่ต้องปรับสมดุลระหว่างรายได้ Alz, EXP ที่ได้ และความยากของมอนสเตอร์/ดันเจี้ยนให้ดีขึ้น เกมควรยังคงท้าทายโดยไม่ทำให้การพัฒนาตัวละครเหนื่อยเกินจำเป็น ผู้เล่นควรรู้สึกว่าเวลาและความพยายามของตัวเองได้รับผลตอบแทน ไม่ว่าจะเป็นสายเล่นสบายๆ หรือสายฮาร์ดคอร์",
  orig:"Positive: Cabal Revolution offers challenging gameplay, rewarding progression, and engaging dungeons that encourage players to improve their builds and strategies.\n\nNegative: Alz and EXP rates can feel too low compared to the time and effort required to progress. Some mobs and dungeons also feel overly difficult, especially when the rewards do not justify the challenge.\n\nNeutral: The current difficulty and grinding system help maintain the game's longevity, but balancing progression and rewards would improve the overall experience.\n\nConclusion\n\nOverall, Cabal Revolution has great potential, but it needs better balancing between Alz income, EXP gains, and mob/dungeon difficulty. The game should remain challenging without making progression unnecessarily exhausting. Players should feel that their time and effort are rewarded, whether they are casual or hardcore gamers.",tags:[],

  cols:[[{"h": "กระแสในหมู่ผู้เล่น", "p": "สำหรับ CABAL Revo ตอนนี้ผู้เล่นเริ่มมีกระแสตื่นเต้นกันพอสมควร\n\nแต่แน่นอนว่าผู้เล่นจำนวนมากไม่พอใจกับระบบ pay-to-play แม้จะปรับให้จ่ายครั้งเดียวตอนเริ่มต้นแทนที่จะจ่ายทุกซีซัน แต่ก็ยังทิ้งความรู้สึกด้านลบอยู่ดี\n\nผู้เล่นที่ยังเล่นอยู่และตั้งใจจะไปต่อใน OBT แบ่งได้เป็น 2 กลุ่ม", "l": ["ผู้เล่นที่รักเกมนี้จริงๆ และไม่ติดขัดที่ต้องจ่ายเงิน", "ผู้เล่นที่ชอบเกมและฟีเจอร์ใหม่ แต่ไม่ค่อยสบายใจที่ต้องจ่ายเงิน"], "c": "dot"}, {"h": "ประเด็นที่ผู้เล่นกังวล", "l": ["ระบบสมาชิกรายเดือน: ผู้เล่นหลายคนมองว่าแพงเกินไป โดยเฉพาะบริการพรีเมียมที่ล็อกไว้ที่แพ็กเกจสูงสุด ราคา $143", "การรีเซ็ตทุก 10 ซีซัน: ผู้เล่นบางคนรู้สึกว่าจะเล่นไปทำไม ถ้าทุกอย่างถูกรีเซ็ตทุก 10 เดือน"], "c": "con", "p2": "โดยรวมแล้วนี่คือความรู้สึกของผู้เล่นที่เห็นอยู่ในช่วงนี้"}], [{"h": "ประสบการณ์เล่น CBT สัปดาห์ที่ผ่านมา", "p": "จากที่เล่นมาตลอดสัปดาห์ของ CBT ยังไม่เจอปัญหาใหญ่ด้านการพัฒนาตัวละคร เพราะช่วงนี้ทุกอย่างถูกทำให้ง่ายขึ้นอยู่ แต่ก็ยังไม่แน่ใจว่าเมื่อเข้า OBT การพัฒนาตัวละครจะเป็นอย่างไร\n\nนอกจากนี้ ยังมีบั๊กค่อนข้างมากที่ทำให้เล่นแล้วสนุกน้อยลง แต่ก็ยังเป็น CBT อยู่ จึงหวังว่าเมื่อถึง OBT เกมจะเสถียรขึ้น และไม่มีบั๊กใหญ่ที่กระทบการเล่น"}, {"h": "อีเวนต์ในช่วง CBT", "p": "พูดตามตรง ส่วนตัวรู้สึกว่าอีเวนต์ในช่วง CBT นี้ยังไม่น่าสนใจเท่าไหร่", "l": ["เป้าหมายยากเกินไปสำหรับผู้เล่นทั่วไปที่จะทำได้ภายใน 2 สัปดาห์ เชื่อว่าทีมงานคงรู้ว่าหมายถึงอะไร โดยเฉพาะผู้เล่นที่มีอุปกรณ์ระดับสูงอยู่แล้ว", "กระทบแรงจูงใจของผู้เล่น สุดท้ายมีแค่ผู้เล่นที่มีทรัพยากรมากกว่าที่อยากแข่งจริงๆ ซึ่งมีไม่มากนัก", "อีเวนต์ไม่สอดคล้องกับทิศทางที่ CABAL Revo กำลังไป โดยเฉพาะการเน้น PvP ที่เข้มข้นขึ้น เช่น อีเวนต์เลเวลที่ให้ถึง OVL 100 ซึ่งแทนที่จะกระตุ้นให้ผู้เล่นออกไปสำรวจและลองฟีเจอร์ใหม่ๆ กลับดันให้ต้องใช้เวลาส่วนใหญ่ AFK ฟาร์มในฟิลด์ทุกวัน เพื่อไล่ให้ทันเลเวล"], "c": "con", "p2": "นอกจากนี้ รางวัลยังเป็นแค่ไอเทมสิ้นเปลือง ไม่มีรางวัลถาวรที่ผู้เล่นเก็บไว้เป็นสัญลักษณ์ของการเข้าร่วมและความสำเร็จในช่วง CBT"}]],
  orig:"Regarding CABAL Revo, there's definitely some hype building up among the players.\n\nBut of course, a lot of players aren't happy with the pay-to-play system.\n\nEven though they changed it so players only need to pay once at the beginning instead of every season, it still leaves a negative impression.\n\nAs for those who are still playing and planning to continue into OBT, I'd say they fall into two groups:\n\n- Players who genuinely love the game and don't mind paying.\n- Players who like the game and its new features, but aren't really comfortable with having to pay.\n\nThen there's the monthly subscription system. A lot of players also feel it's too expensive, especially since the premium service is locked behind the highest tier, which costs $143.\n\nAnother concern is the reset every 10 seasons. Some players feel like, what's the point of playing if everything gets reset every 10 months?\n\nSo yeah, these are pretty much the general sentiments I've been seeing among the players.\n\nBased on my experience playing during this past week of CBT, I haven't really faced any major difficulties with progression so far, since pretty much everything is still made easier during this phase.\nBut I'm still not sure what progression will actually look like once OBT starts.\nThere are also still quite a lot of bugs that make the gameplay experience less enjoyable.\nBut then again, this is still CBT. Hopefully, things will be more stable by the time OBT starts, with no major bugs affecting the gameplay.\n\nBut to be honest, I personally feel that the events during this CBT aren't really that interesting.\n1. The goals are too difficult for regular players to achieve within just 2 weeks. I'm pretty sure the team already knows what I'm referring to, especially when it comes to players who already have high-tier equipment.\n2. This also affects player motivation. In the end, only players with more resources are really motivated to compete, and there aren't that many of them.\n3. The events don't really align with the direction CABAL Revo is trying to take, especially with its stronger focus on PvP. I'm specifically talking about the leveling event that requires players to reach OVL 100. Instead of encouraging players to explore and experience more of the new features, it pushes them to spend most of their time AFK farming in the field, day after day, just to keep up with level progression.\n\nOn top of that, the rewards are only consumable items. There aren't any permanent rewards that players can keep as a symbol of their participation and achievement during the CBT phase.",tags:[],
  hl:["ผู้เล่นจำนวนมากไม่พอใจกับระบบ pay-to-play", "ยังทิ้งความรู้สึกด้านลบอยู่ดี", "แพงเกินไป", "การรีเซ็ตทุก 10 ซีซัน", "ยังไม่เจอปัญหาใหญ่ด้านการพัฒนาตัวละคร", "ยังมีบั๊กค่อนข้างมาก", "เป้าหมายยากเกินไปสำหรับผู้เล่นทั่วไป", "ไม่มีรางวัลถาวร"],
  hlEn:["a lot of players aren't happy with the pay-to-play system", "it still leaves a negative impression", "it's too expensive", "the reset every 10 seasons", "haven't really faced any major difficulties with progression", "quite a lot of bugs", "The goals are too difficult for regular players", "There aren't any permanent rewards"]}
];

var LANG="th",cur="ALL",UPDATED_EN="Nov 2026";
var UI={th:{sub:"ความคิดเห็นจากสตรีมเมอร์ที่ร่วมงานกับเรา · อัปเดตล่าสุด ",all:"ทั้งหมด",n:"สตรีมเมอร์ที่ให้ฟีดแบ็ก",avg:"ความพึงพอใจเฉลี่ย",rec:"พึงพอใจ (4–5 ดาว)",fol:"Followers รวม",empty:"ไม่พบข้อมูล",ov:"ภาพรวม",mid:"ความเห็นกลางๆ",sum:"สรุป",pro:"จุดแข็ง",con:"จุดที่ควรปรับปรุง"},
 en:{sub:"Feedback from streamers working with us · Last updated ",all:"All",n:"Streamers who gave feedback",avg:"Average satisfaction",rec:"Satisfied (4–5 stars)",fol:"Total followers",empty:"No entries found",ov:"Overview",mid:"Neutral",sum:"Summary",pro:"Strengths",con:"Areas to improve"}};
function T(k){return UI[LANG][k]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hl(t,p){var s=esc(t);(p||[]).forEach(function(x){var e=esc(x);s=s.split(e).join('<mark>'+e+'</mark>')});return s}
function hp(d){return LANG==="en"?d.hlEn:d.hl}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"K":String(n)}
function stars(r){if(!r)return "";var s="";for(var i=1;i<=5;i++)s+=i<=r?"★":"<s>★</s>";return '<span class="stars">'+s+'</span>'}
function ini(n){return n.replace(/[^A-Za-z0-9ก-๙ ]/g,"").split(" ").map(function(w){return w[0]}).join("").slice(0,2).toUpperCase()}
function who(d){
  var nm=d.url?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px solid var(--line2)">'+esc(d.name)+' ↗</a>':esc(d.name);
  var mt=(d.platform?'<span class="pill">'+esc(d.platform)+'</span>':'');
  var ai=d.img?'<img src="'+esc(d.img)+'" alt="">':esc(ini(d.name));
  var av=d.url?'<a class="av" href="'+esc(d.url)+'" target="_blank" rel="noopener" aria-label="'+esc(d.name)+'">'+ai+'</a>':'<div class="av">'+ai+'</div>';
  return '<div class="who">'+av+'<div><div class="nm">'+nm+'</div>'+(mt?'<div class="mt">'+mt+'</div>':'')+'</div>'+(d.followers?'<div class="fol"><b>'+fmt(d.followers)+'</b>Followers</div>':'')+'</div>';
}
function kpis(){
  var n=DATA.length,rated=DATA.filter(function(d){return d.rating}),
      reach=DATA.reduce(function(s,d){return s+(d.followers||0)},0),h='<div class="kpi"><small>'+T("n")+'</small><b>'+n+'</b></div>';
  if(rated.length){
    var a=(rated.reduce(function(s,d){return s+d.rating},0)/rated.length).toFixed(1),
        rec=Math.round(rated.filter(function(d){return d.rating>=4}).length/rated.length*100);
    h+='<div class="kpi"><small>'+T("avg")+'</small><b class="g">'+a+' / 5</b></div><div class="kpi"><small>'+T("rec")+'</small><b>'+rec+'%</b></div>';
  }
  if(reach)h+='<div class="kpi"><small>'+T("fol")+'</small><b>'+fmt(reach)+'</b></div>';
  document.getElementById("kpis").innerHTML=h;
}
function hero(){
  var el=document.getElementById("hero"),d=DATA.filter(function(x){return x.featured})[0];
  if(!d){el.style.display="none";return}
  el.style.display="";
  el.innerHTML='<span class="big">“</span><p class="q">'+hl(LANG==="en"?(d.orig||d.quote):d.quote,hp(d))+'</p>'+stars(d.rating)+who(d).replace('class="who"','class="who" style="border:0;padding-top:12px"');
}
function chips(){
  var g=["ALL"];DATA.forEach(function(d){if(d.game&&g.indexOf(d.game)<0)g.push(d.game)});
  var el=document.getElementById("chips");
  if(g.length<3){el.innerHTML="";return}
  el.innerHTML=g.map(function(s){return '<button class="chip'+(s===cur?' on':'')+'" data-s="'+esc(s)+'">'+esc(s==="ALL"?T("all"):s)+'</button>'}).join("");
}
function lst(t,a,c,p){return a&&a.length?'<div><h4 class="h">'+t+'</h4><ul class="lst '+c+'">'+a.map(function(x){return '<li>'+hl(x,p)+'</li>'}).join("")+'</ul></div>':""}
function sec(s,p){
  var h=s.h?'<h4 class="h">'+s.h+'</h4>':'';
  var a=s.p?'<p class="txt">'+hl(s.p,p)+'</p>':'';
  var l=s.l?'<ul class="lst '+(s.c||'dot')+'" style="margin-top:'+(s.p?12:0)+'px">'+s.l.map(function(x){return '<li>'+hl(x,p)+'</li>'}).join("")+'</ul>':'';
  var b=s.p2?'<p class="txt" style="margin-top:12px">'+hl(s.p2,p)+'</p>':'';
  return '<div>'+h+a+l+b+'</div>';
}
function wide(d){
  var inner,p=hp(d);
  if(LANG==="en")inner='<p class="txt en-body">'+hl(d.orig||d.quote||"",p)+'</p>';
  else if(d.cols)inner='<div class="cols">'+d.cols.map(function(c){return '<div style="display:grid;gap:24px;align-content:start">'+c.map(function(s){return sec(s,p)}).join("")+'</div>'}).join("")+'</div>';
  else inner='<div class="cols"><div>'+(d.quote?'<h4 class="h">'+T("ov")+'</h4><p class="txt">'+hl(d.quote,p)+'</p>':'')+(d.mid?'<h4 class="h" style="margin-top:20px">'+T("mid")+'</h4><p class="txt">'+hl(d.mid,p)+'</p>':'')+(d.closing?'<h4 class="h" style="margin-top:20px">'+T("sum")+'</h4><p class="txt">'+hl(d.closing,p)+'</p>':'')+'</div><div style="display:grid;gap:22px;align-content:start">'+lst(T("pro"),d.pros,'pro',p)+lst(T("con"),d.cons,'con',p)+'</div></div>';
  return '<article class="card wide">'+stars(d.rating)+inner+who(d)+'</article>';
}
function card(d){
  if(d.pros||d.cons||d.cols)return wide(d);
  var q=LANG==="en"?(d.orig||d.quote):d.quote;
  return '<article class="card">'+stars(d.rating)+(d.shot?'<img class="shot" src="'+esc(d.shot)+'" alt="">':'')+
  '<p class="txt">“'+hl(q,hp(d))+'”</p>'+((d.tags||[]).length?'<div class="tags">'+d.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div>':'')+who(d)+'</article>';
}
function render(){
  document.documentElement.lang=LANG;
  document.getElementById("subt").textContent=T("sub")+(LANG==="en"?UPDATED_EN:UPDATED);
  document.getElementById("lang").innerHTML='<button data-l="th"'+(LANG==="th"?' class="on"':'')+'>TH</button><button data-l="en"'+(LANG==="en"?' class="on"':'')+'>EN</button>';
  kpis();hero();chips();
  var list=DATA.filter(function(d){return cur==="ALL"||d.game===cur});
  document.getElementById("wall").innerHTML=list.length?list.map(card).join(""):'<div class="empty">'+T("empty")+'</div>';
}
function setLang(l){
  if(l!==LANG){LANG=l;render()}
  try{if(location.hash!=="#"+l)location.hash="#"+l}catch(e){}
}
document.getElementById("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(b){cur=b.dataset.s;render()}});
document.getElementById("lang").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setLang(b.dataset.l)});
window.addEventListener("hashchange",function(){var h=(location.hash||"").slice(1);if((h==="th"||h==="en")&&h!==LANG){LANG=h;render()}});
if((location.hash||"").slice(1)==="en")LANG="en";
render();
</script>
